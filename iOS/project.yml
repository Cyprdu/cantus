# Projet Xcode décrit en YAML : le .xcodeproj est généré par XcodeGen sur le runner macOS
# (voir .github/workflows/ios.yml), on n'a donc jamais besoin d'ouvrir Xcode.
name: Cantus
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Cantus:
    type: application
    platform: iOS
    sources:
      - path: Cantus
        excludes: [bridge.js, skin.css, "fonts/**"]
      - path: Cantus/bridge.js
        buildPhase: resources
      - path: Cantus/skin.css
        buildPhase: resources
      - path: Cantus/fonts/Newsreader.woff2
        buildPhase: resources
      - path: Cantus/fonts/DMSans.woff2
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.cantus-app.cantus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Cantus/Info.plist
      properties:
        CFBundleDisplayName: Cantus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # App-Bound Domains : c'est ce qui autorise le service worker (sw.js) dans WKWebView,
        # donc tout le hors-ligne de la PWA (shell + cache des PDF/paroles).
        WKAppBoundDomains: [cantus-app.fr, api.github.com, raw.githubusercontent.com, cantus-live.cyprien-veyret.workers.dev]
        NSCameraUsageDescription: Cantus utilise la caméra pour scanner les QR codes de playlists et pour tourner les pages d'un mouvement de tête.
        NSPhotoLibraryUsageDescription: Cantus accède à vos photos pour choisir la couverture d'une playlist.
